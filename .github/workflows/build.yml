name: build

# Builds run HERE, never on the agent hosts.
# Both droplets are ~1-2 GB RAM with <5 GB free disk; a single `npm install`
# has previously OOM'd the gateway. The installable artifact is produced in CI
# and downloaded as a tarball.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests (publish gate)
        run: npm test

      - name: Verify build output
        run: |
          set -eu
          for f in dist/manifest.js dist/worker.js dist/ui/index.js; do
            test -s "$f" || { echo "MISSING OR EMPTY: $f"; exit 1; }
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done
          test -s migrations/001_publish_log.sql

      - name: Verify the migration namespace matches the derived one
        # The host derives plugin_<slug>_<sha256(pluginId)[0:10]>. If the
        # migration SQL hardcodes a different schema, every statement is
        # rejected at install time. Catch that here, not on the server.
        run: node scripts/verify-namespace.mjs

      - name: Package installable artifact
        run: |
          set -eu
          mkdir -p out/paperclip-content-calendar
          cp -r dist migrations package.json README.md out/paperclip-content-calendar/
          tar -czf paperclip-content-calendar.tar.gz -C out paperclip-content-calendar
          echo "artifact: $(wc -c < paperclip-content-calendar.tar.gz) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: paperclip-content-calendar
          path: paperclip-content-calendar.tar.gz
          retention-days: 30
